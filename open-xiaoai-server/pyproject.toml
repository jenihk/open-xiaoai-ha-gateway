[project]
name = "open-xiaoai-bridge"
version = "1.0.0"
description = "小爱音箱与外部 AI 服务的桥接器"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "asyncio>=3.4.3",
    "maturin>=1.8.3",
    "numpy>=2.2.3",
    "onnxruntime==1.23.2",
    "pypinyin>=0.54.0",
    "requests>=2.32.3",
    "sentencepiece>=0.2.0",
    "sherpa-onnx>=1.12.26",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "native/Cargo.toml"

[tool.uv]
# Rebuild package when any rust files change
# https://github.com/PyO3/maturin/issues/2314#issuecomment-2488542771
cache-keys = [
    { file = "pyproject.toml" },
    { file = "native/Cargo.toml" },
    { file = "native/src/**/*.rs" },
]
